<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #10b982; stroke-width: 2.5; }
      .pv-panel { fill: #10b982; }
      .inverter-frame { fill: none; stroke: #10b982; stroke-width: 5.2; stroke-linejoin: round; }
      .divider-line { stroke: #b0bec5; stroke-width: 3; stroke-linecap: round; }
      .symbol { stroke: #1a1a1a; stroke-width: 4.5; stroke-linecap: round; fill: none; }
      .symbol-ac { stroke: #2563eb; stroke-width: 4.5; stroke-linecap: round; fill: none; }
      .shadow-effect { flood-color: #000000; flood-opacity: 0.18; }
    </style>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" class="shadow-effect" />
    </filter>
  </defs>

  <!-- Nền & Viền xanh hợp nhất sát viền ngoài -->
  <rect class="card-bg" x="1.25" y="1.25" width="197.5" height="207.5" rx="18"/>

  <!-- Tấm PV -->
  <polygon id="bottom-pv-panel" class="pv-panel" points="65,44 165,44 135,80 35,80" />
  <polygon id="top-pv-panel" class="pv-panel" points="65,20 165,20 135,56 35,56" filter="url(#shadow)" />

  <!-- Khung Inverter AC/DC -->
  <g id="inverter-box">
    <rect class="inverter-frame" x="32.5" y="100" width="135" height="89" rx="19" />
    <line class="divider-line" x1="45" y1="178" x2="155" y2="111" />

    <!-- Ký hiệu DC (=) -->
    <line class="symbol" x1="48" y1="121" x2="84" y2="121" />
    <line class="symbol" x1="48" y1="134" x2="84" y2="134" />

    <!-- Ký hiệu AC (Sóng sin ~) -->
    <path class="symbol-ac" d="M 112 154 Q 118 146 125 154 T 138 154" />
    <path class="symbol-ac" d="M 112 167 Q 118 159 125 167 T 138 167" />
  </g>
</svg>
