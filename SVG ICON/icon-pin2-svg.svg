<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38.72 55" width="100%" height="100%">
  <defs>
    <style>
      /* Giao diện màu cố định */
      .battery-terminal { fill: #16a34a; }
      .battery-body { fill: #ffffff; stroke: #16a34a; stroke-width: 2; }
      .battery-fill { fill: #16a34a; }
    </style>
  </defs>

  <!-- Đầu cực pin -->
  <rect class="battery-terminal" x="13.31" y="1" width="12.1" height="4" rx="1.5" />

  <!-- Thân / Vỏ ngoài pin -->
  <rect class="battery-body" x="2.42" y="5" width="33.88" height="48" rx="4" />

  <!-- Mức dung lượng pin -->
  <rect class="battery-fill" x="4.84" y="7" width="29.04" height="43" rx="1.5" />
</svg>
