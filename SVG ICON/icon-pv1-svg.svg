<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90">
  <defs>
    <!-- Cắt gọn lưới vừa khít bên trong tấm PV -->
    <clipPath id="pv-clip">
      <polygon points="32,42 86,42 96,86 18,86" />
    </clipPath>
  </defs>

  <!-- Mặt trời -->
  <g stroke="#52b788" stroke-width="4.5" stroke-linecap="round" fill="none">
    <circle cx="34" cy="34" r="14" fill="#52b788" />
    <line x1="34" y1="12" x2="34" y2="5" />
    <line x1="18" y1="18" x2="13" y2="13" />
    <line x1="12" y1="34" x2="5" y2="34" />
    <line x1="18" y1="50" x2="13" y2="55" />
    <line x1="50" y1="18" x2="55" y2="13" />
    <line x1="56" y1="34" x2="63" y2="34" />
  </g>

  <!-- Tấm PV đè lên mặt trời với viền 1.875px (bằng 3/4 đường kẻ trong) -->
  <polygon points="32,42 86,42 96,86 18,86" fill="#52b788" stroke="#ffffff" stroke-width="1.875" stroke-linejoin="round"/>

  <!-- Đường lưới bên trong tấm PV -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" clip-path="url(#pv-clip)">
    <line x1="28.5" y1="53" x2="88.5" y2="53" />
    <line x1="25" y1="64" x2="91" y2="64" />
    <line x1="21.5" y1="75" x2="93.5" y2="75" />
    <line x1="45.5" y1="42" x2="37.5" y2="86" />
    <line x1="59" y1="42" x2="57" y2="86" />
    <line x1="72.5" y1="42" x2="76.5" y2="86" />
  </g>
</svg>
