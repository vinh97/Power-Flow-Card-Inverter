<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100%" height="100%">
  <defs>
    <style>
      /* Mặc định (Giao diện sáng) */
      .sun-icon { stroke: #52b788; fill: none; stroke-width: 4.5; stroke-linecap: round; }
      .sun-core { fill: #52b788; }
      .pv-frame { fill: #52b788; stroke: #ffffff; stroke-width: 1.875; stroke-linejoin: round; }
      .pv-grid { stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; opacity: 0.9; }

      /* Tối ưu riêng cho Giao diện tối (Dark Mode) */
      @media (prefers-color-scheme: dark) {
        .sun-icon { stroke: #74c69d; }
        .sun-core { fill: #74c69d; }
        .pv-frame { fill: #2d6a4f; stroke: #74c69d; }
        .pv-grid { stroke: #d8f3dc; opacity: 0.95; }
      }
    </style>
    
    <!-- Cắt gọn lưới vừa khít bên trong tấm PV -->
    <clipPath id="pv-clip">
      <polygon points="32,42 86,42 96,86 18,86" />
    </clipPath>
  </defs>

  <!-- Mặt trời -->
  <g class="sun-icon">
    <circle class="sun-core" cx="34" cy="34" r="14" />
    <line x1="34" y1="12" x2="34" y2="5" />
    <line x1="18" y1="18" x2="13" y2="13" />
    <line x1="12" y1="34" x2="5" y2="34" />
    <line x1="18" y1="50" x2="13" y2="55" />
    <line x1="50" y1="18" x2="55" y2="13" />
    <line x1="56" y1="34" x2="63" y2="34" />
  </g>

  <!-- Tấm PV (Khung chính) -->
  <polygon class="pv-frame" points="32,42 86,42 96,86 18,86" />

  <!-- Đường lưới bên trong tấm PV -->
  <g class="pv-grid" clip-path="url(#pv-clip)">
    <!-- Đường ngang -->
    <line x1="28.5" y1="53" x2="88.5" y2="53" />
    <line x1="25" y1="64" x2="91" y2="64" />
    <line x1="21.5" y1="75" x2="93.5" y2="75" />
    <!-- Đường dọc -->
    <line x1="45.5" y1="42" x2="37.5" y2="86" />
    <line x1="59" y1="42" x2="57" y2="86" />
    <line x1="72.5" y1="42" x2="76.5" y2="86" />
  </g>
</svg>
