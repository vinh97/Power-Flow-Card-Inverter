<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 105 100" width="100%" height="100%">
  <defs>
    <style>
      /* Giao diện màu cố định */
      .house-accent { fill: #52b788; }
      .roof-stroke { stroke: #52b788; fill: none; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .house-body { fill: #52b788; }
      .lightning { fill: #ffffff; }
    </style>
  </defs>

  <!-- Ống khói -->
  <rect class="house-accent" x="28.35" y="14" width="10.5" height="20" rx="1" />

  <!-- Mái nhà -->
  <path class="roof-stroke" d="M 10.5 50 L 52.5 21 L 94.5 50" />

  <!-- Thân nhà -->
  <path class="house-body" d="M 52.5 29.5 L 86.1 52.5 L 86.1 85 C 86.1 86.5 84.5 88 83 88 L 22.1 88 C 20.5 88 18.9 86.5 18.9 85 L 18.9 52.5 Z" />

  <!-- Biểu tượng tia sét -->
  <polygon class="lightning" points="54.6,45.5 44.1,60.5 52,60.5 48.8,78.5 60.9,59.5 53,59.5" />
</svg>
