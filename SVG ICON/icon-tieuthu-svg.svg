<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 92" width="100%" height="100%" class="svg-icon-house">
  <defs>
    <style>
      .house-accent { fill: #10b982; }
      .roof-stroke { stroke: #10b982; fill: none; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .house-body { fill: #10b982; }
    </style>

    <!-- Mặt nạ đục rỗng tia sét trong suốt -->
    <mask id="lightning-cutout">
      <rect width="100%" height="100%" fill="white" />
      <polygon points="52.1,41.5 41.6,56.5 49.5,56.5 46.3,74.5 58.4,55.5 50.5,55.5" fill="black" />
    </mask>
  </defs>

  <!-- Ống khói -->
  <rect class="house-accent" x="25.85" y="10" width="10.5" height="20" rx="1" />

  <!-- Mái nhà -->
  <path class="roof-stroke" d="M 8 46 L 50 17 L 92 46" />

  <!-- Thân nhà (Đục rỗng hình tia sét nhìn xuyên nền) -->
  <path class="house-body" mask="url(#lightning-cutout)" d="M 50 25.5 L 83.6 48.5 L 83.6 81 C 83.6 82.5 82 84 80.5 84 L 19.6 84 C 18 84 16.4 82.5 16.4 81 L 16.4 48.5 Z" />
</svg>
