<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="100%" height="100%">
  <defs>
    <style>
      /* Giao diện màu cố định */
      .icon-stroke { stroke: #52b788; }
      .icon-fill { fill: #52b788; }
      .icon-text { fill: #52b788; }
    </style>
  </defs>

  <g stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Khung UPS -->
    <rect class="icon-stroke" x="8" y="8" width="23" height="12" rx="3"/>
    <text class="icon-text" x="19.5" y="16.5" font-size="7.5" font-weight="bold" stroke="none" text-anchor="middle" font-family="sans-serif">UPS</text>

    <!-- Nguồn / Pin -->
    <circle class="icon-stroke" cx="43" cy="23" r="9"/>
    <line class="icon-stroke" x1="40" y1="19" x2="40" y2="27" stroke-width="2.5"/>
    <line class="icon-stroke" x1="46" y1="19" x2="46" y2="27" stroke-width="2.5"/>

    <!-- Đường dây kết nối -->
    <path class="icon-stroke" d="M 8 20 C 12 28, 10 38, 12 43 L 24 43"/>

    <!-- Chi tiết phụ -->
    <path class="icon-fill" d="M 23 37 C 23 37, 32 34, 35 43 C 36 48, 30 52, 24 50 Z"/>
    <line class="icon-stroke" x1="31" y1="34" x2="35" y2="30" stroke-width="2.5"/>
    <line class="icon-stroke" x1="36" y1="39" x2="40" y2="35" stroke-width="2.5"/>
  </g>
</svg>
