<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #10b982; stroke-width: 2.5; }
      .pv-panel { fill: #10b982; fill-opacity: 0.2; stroke: #10b982; stroke-width: 2.5; stroke-linejoin: round; }
      .pv-line { stroke: #10b982; stroke-width: 1.8; }
      .inverter-frame { fill: #ffffff; stroke: #10b982; stroke-width: 4; stroke-linejoin: round; }
      .divider-line { stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; }
      .symbol { stroke: #1e293b; stroke-width: 4; stroke-linecap: round; fill: none; }
      .symbol-ac { stroke: #0284c7; stroke-width: 3.5; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <!-- Nền & Viền ngoài -->
  <rect class="card-bg" x="1.25" y="1.25" width="197.5" height="207.5" rx="18"/>

  <!-- Tấm PV phẳng (Đã bỏ bóng / lớp chồng sáng tối) -->
  <g id="pv-panel-group">
    <polygon class="pv-panel" points="35,78 165,78 145,28 55,28" />
    <line class="pv-line" x1="100" y1="28" x2="100" y2="78" />
    <line class="pv-line" x1="45" y1="53" x2="155" y2="53" />
  </g>

  <!-- Khung Inverter AC/DC -->
  <g id="inverter-box">
    <rect class="inverter-frame" x="32.5" y="100" width="135" height="89" rx="19" />
    <line class="divider-line" x1="45" y1="178" x2="155" y2="111" />

    <!-- Ký hiệu DC (=) -->
    <line class="symbol" x1="48" y1="121" x2="84" y2="121" />
    <line class="symbol" x1="48" y1="134" x2="84" y2="134" />

    <!-- Ký hiệu AC (Sóng sin ~) -->
    <path class="symbol-ac" d="M 112 154 Q 118 146 125 154 T 138 154" />
    <path class="symbol-ac" d="M 112 167 Q 118 159 125 167 T 138 167" />
  </g>
</svg>
