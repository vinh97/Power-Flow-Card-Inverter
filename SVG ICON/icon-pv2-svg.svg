<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Nền sáng sạch -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="16"/>

  <defs>
    <!-- Đổ bóng tách khối nhẹ -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ==================== MẶT TRỜI ==================== -->
  <g id="sun" filter="url(#shadow)">
    <!-- Các tia nắng (chia đều góc 45 độ) -->
    <line x1="65" y1="32" x2="65" y2="20" stroke="#10B982" stroke-width="4" stroke-linecap="round" />
    <line x1="41.7" y1="41.7" x2="33.2" y2="33.2" stroke="#10B982" stroke-width="4" stroke-linecap="round" />
    <line x1="32" y1="65" x2="20" y2="65" stroke="#10B982" stroke-width="4" stroke-linecap="round" />
    <line x1="41.7" y1="88.3" x2="33.2" y2="96.8" stroke="#10B982" stroke-width="4" stroke-linecap="round" />
    <line x1="88.3" y1="41.7" x2="96.8" y2="33.2" stroke="#10B982" stroke-width="4" stroke-linecap="round" />
    <line x1="98" y1="65" x2="110" y2="65" stroke="#10B982" stroke-width="4" stroke-linecap="round" />

    <!-- Thân mặt trời -->
    <circle cx="65" cy="65" r="25" fill="#10B982" />
  </g>

  <!-- ==================== TẤM PIN MẶT TRỜI (PV PANEL) ==================== -->
  <g id="pv-panel" filter="url(#shadow)">
    <!-- Khung tấm pin -->
    <polygon points="70,78 162,78 134,162 42,162" fill="#10B982" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Lưới ô pin (3x3 grid) -->
    <line x1="100.7" y1="78" x2="72.7" y2="162" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="131.3" y1="78" x2="103.3" y2="162" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="60.7" y1="106" x2="152.7" y2="106" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="51.3" y1="134" x2="143.3" y2="134" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
</svg>
