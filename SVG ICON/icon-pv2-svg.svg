<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      :root {
        /* Bảng màu Giao diện sáng (Light Mode) */
        --bg-color: #ffffff;
        --sun-color: #10b982;
        --pv-frame-color: #10b982;
        --pv-grid-color: #ffffff;
        --pv-grid-opacity: 1;
        --shadow-color: #000000;
        --shadow-opacity: 0.18;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Bảng màu Giao diện tối (Dark Mode) */
          --bg-color: #0f172a;
          --sun-color: #34d399;
          --pv-frame-color: #059669;
          --pv-grid-color: #ecfdf5;
          --pv-grid-opacity: 0.95;
          --shadow-opacity: 0.45;
        }
      }

      /* Khai báo thuộc tính bằng CSS Variables */
      .bg { fill: var(--bg-color); }
      .sun-rays line { stroke: var(--sun-color); stroke-width: 4; stroke-linecap: round; }
      .sun-body { fill: var(--sun-color); }
      .pv-frame { fill: var(--pv-frame-color); }
      .pv-grid line { stroke: var(--pv-grid-color); stroke-width: 2.5; stroke-linecap: round; opacity: var(--pv-grid-opacity); }
      .shadow-effect { flood-color: var(--shadow-color); flood-opacity: var(--shadow-opacity); }
    </style>

    <!-- Cắt gọn lưới vừa khít khung tấm PV -->
    <clipPath id="pv-clip">
      <polygon points="70,78 162,78 134,162 42,162" />
    </clipPath>

    <!-- Mask đục hở phần mặt trời tại vùng bị tấm PV che (khoảng hở = 3/4 nét kẻ PV = 1.875px) -->
    <mask id="sun-cutout">
      <rect width="100%" height="100%" fill="#ffffff" />
      <polygon points="70,78 162,78 134,162 42,162" fill="#000000" stroke="#000000" stroke-width="3.75" stroke-linejoin="round" />
    </mask>

    <!-- Đổ bóng tách khối -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" class="shadow-effect" />
    </filter>
  </defs>

  <!-- Nền chuyển đổi thông minh -->
  <rect class="bg" width="100%" height="100%" rx="16"/>

  <!-- ==================== MẶT TRỜI ==================== -->
  <g id="sun" filter="url(#shadow)" mask="url(#sun-cutout)">
    <g class="sun-rays">
      <line x1="65" y1="32" x2="65" y2="20" />
      <line x1="41.7" y1="41.7" x2="33.2" y2="33.2" />
      <line x1="32" y1="65" x2="20" y2="65" />
      <line x1="41.7" y1="88.3" x2="33.2" y2="96.8" />
      <line x1="88.3" y1="41.7" x2="96.8" y2="33.2" />
      <line x1="98" y1="65" x2="110" y2="65" />
    </g>
    <circle cx="65" cy="65" r="25" class="sun-body" />
  </g>

  <!-- ==================== TẤM PIN MẶT TRỜI ==================== -->
  <g id="pv-panel" filter="url(#shadow)">
    <!-- Khung tấm pin (không viền) -->
    <polygon points="70,78 162,78 134,162 42,162" class="pv-frame" />

    <!-- Lưới ô pin được cắt gọn bằng clip-path -->
    <g class="pv-grid" clip-path="url(#pv-clip)">
      <line x1="100.7" y1="78" x2="72.7" y2="162" />
      <line x1="131.3" y1="78" x2="103.3" y2="162" />
      <line x1="60.7" y1="106" x2="152.7" y2="106" />
      <line x1="51.3" y1="134" x2="143.3" y2="134" />
    </g>
  </g>
</svg>
