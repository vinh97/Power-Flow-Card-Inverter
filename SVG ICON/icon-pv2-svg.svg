<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .sun-rays line { stroke: #10b982; stroke-width: 5.77; stroke-linecap: round; }
      .sun-body { fill: #10b982; }
      .pv-frame { fill: #10b982; }
      .pv-grid-line { stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; }
      .shadow-effect { flood-color: #000000; flood-opacity: 0.18; }
    </style>

    <!-- ClipPath bo góc cho tấm PV -->
    <clipPath id="pv-clip">
      <path d="M 71,74 L 161,74 Q 163,74 162.2,75.9 L 133.8,156.1 Q 133,158 131,158 L 41,158 Q 39,158 39.8,156.1 L 68.2,75.9 Q 69,74 71,74 Z" />
    </clipPath>

    <!-- Mặt nạ cắt khuyết Mặt Trời & Tia nắng phía sau tấm PV -->
    <mask id="sun-cutout">
      <rect width="100%" height="100%" fill="white" />
      <path d="M 71,74 L 161,74 Q 163,74 162.2,75.9 L 133.8,156.1 Q 133,158 131,158 L 41,158 Q 39,158 39.8,156.1 L 68.2,75.9 Q 69,74 71,74 Z"
            fill="black"
            stroke="black"
            stroke-width="5"
            stroke-linejoin="round" />
    </mask>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" class="shadow-effect" />
    </filter>
  </defs>

  <!-- 12 TIA NẮNG -->
  <g id="sun-rays-outer" filter="url(#shadow)" mask="url(#sun-cutout)">
    <g class="sun-rays">
      <line x1="68.0" y1="35.2" x2="68.0" y2="14.2" />
      <line x1="89.4" y1="40.9" x2="100.0" y2="22.7" />
      <line x1="105.1" y1="56.6" x2="123.3" y2="46.0" />
      <line x1="110.8" y1="78.0" x2="131.8" y2="78.0" />
      <line x1="105.1" y1="99.4" x2="123.3" y2="110.0" />
      <line x1="89.4" y1="115.1" x2="100.0" y2="133.3" />
      <line x1="68.0" y1="120.8" x2="68.0" y2="141.8" />
      <line x1="46.6" y1="115.1" x2="36.0" y2="133.3" />
      <line x1="30.9" y1="99.4" x2="12.7" y2="110.0" />
      <line x1="25.2" y1="78.0" x2="4.2" y2="78.0" />
      <line x1="30.9" y1="56.6" x2="12.7" y2="46.0" />
      <line x1="46.6" y1="40.9" x2="36.0" y2="22.7" />
    </g>
  </g>

  <!-- MẶT TRỜI -->
  <g id="sun" filter="url(#shadow)" mask="url(#sun-cutout)">
    <circle cx="68" cy="78" r="30.8" class="sun-body" />
  </g>

  <!-- TẤM PIN MẶT TRỜI (Dùng ClipPath giới hạn tuyệt đối, vẽ đường rãnh trắng chuẩn đều không lộ vết cắt) -->
  <g id="pv-panel" filter="url(#shadow)">
    <!-- Khối nền tấm pin -->
    <path class="pv-frame" clip-path="url(#pv-clip)" d="M 71,74 L 161,74 Q 163,74 162.2,75.9 L 133.8,156.1 Q 133,158 131,158 L 41,158 Q 39,158 39.8,156.1 L 68.2,75.9 Q 69,74 71,74 Z" />
    
    <!-- Các đường rãnh chia lưới nằm gọn trong khung pin -->
    <g clip-path="url(#pv-clip)" class="pv-grid-line">
      <!-- 2 Đường dọc chia đều chuẩn xác -->
      <line x1="101" y1="74" x2="71.7" y2="158" />
      <line x1="131" y1="74" x2="101.7" y2="158" />
      <!-- 2 Đường ngang chia đều -->
      <line x1="35" y1="102" x2="167" y2="102" />
      <line x1="30" y1="130" x2="162" y2="130" />
    </g>
  </g>
</svg>
