<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="100%" height="100%">
  <defs>
    <style>
      /* Giao diện sáng (Light Mode) */
      .bg { fill: #ffffff; }
      .dashed-border { fill: none; stroke: #b0bec5; stroke-width: 2; stroke-dasharray: 6,4; }
      .pv-bottom { fill: #10b982; }
      .pv-top { fill: #10b982; }
      .inverter-frame { fill: none; stroke: #10b982; stroke-width: 5.2; stroke-linejoin: round; }
      .divider-line { stroke: #b0bec5; stroke-width: 3; stroke-linecap: round; }
      .symbol { stroke: #1a1a1a; stroke-width: 4.5; stroke-linecap: round; fill: none; }
      .shadow-effect { flood-color: #000000; flood-opacity: 0.18; }

      /* Giao diện tối (Dark Mode) */
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .dashed-border { stroke: #475569; }
        .pv-bottom { fill: #047857; }
        .pv-top { fill: #059669; }
        .inverter-frame { stroke: #34d399; }
        .divider-line { stroke: #64748b; }
        .symbol { stroke: #f8fafc; }
        .shadow-effect { flood-color: #000000; flood-opacity: 0.45; }
      }
    </style>

    <!-- Đổ bóng tách khối -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" class="shadow-effect" />
    </filter>
  </defs>

  <!-- Nền chuyển đổi thông minh -->
  <rect class="bg" width="100%" height="100%" rx="16"/>

  <!-- Viền nét đứt lề -->
  <rect class="dashed-border" x="6" y="6" width="188" height="198" rx="18"/>

  <!-- ==================== TẤM PV DƯỚI (TẤM 2) ==================== -->
  <polygon id="bottom-pv-panel" class="pv-bottom" points="65,44 165,44 135,80 35,80" />

  <!-- ==================== TẤM PV TRÊN (TẤM 1) ==================== -->
  <polygon id="top-pv-panel" class="pv-top" points="65,20 165,20 135,56 35,56" filter="url(#shadow)" />

  <!-- ==================== KHUNG INVERTER / BỘ ĐIỀU KHIỂN ==================== -->
  <g id="inverter-box">
    <!-- Khung viền -->
    <rect class="inverter-frame" x="32.5" y="100" width="135" height="89" rx="19" />

    <!-- Thanh chéo phân chia -->
    <line class="divider-line" x1="45" y1="178" x2="155" y2="111" />

    <!-- Ký hiệu '=' (DC) -->
    <line class="symbol" x1="48" y1="121" x2="84" y2="121" />
    <line class="symbol" x1="48" y1="134" x2="84" y2="134" />

    <!-- Ký hiệu '~' (AC) -->
    <path class="symbol" d="M 112 154 Q 118 146 125 154 T 138 154" />
    <path class="symbol" d="M 112 167 Q 118 159 125 167 T 138 167" />
  </g>
</svg>
