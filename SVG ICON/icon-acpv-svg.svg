<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="100%" height="100%">
  <!-- Nền sáng sạch -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="16"/>

  <!-- Viền nét đứt màu xám bạc mờ xung quanh lề -->
  <rect x="6" y="6" width="188" height="198" rx="18" fill="none" stroke="#B0BEC5" stroke-width="2" stroke-dasharray="6,4"/>

  <defs>
    <!-- Đổ bóng tách khối nhẹ -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ==================== TẤM PV DƯỚI (TẤM 2) ==================== -->
  <polygon id="bottom-pv-panel" points="65,44 165,44 135,80 35,80" fill="#10B982" />

  <!-- ==================== TẤM PV TRÊN (TẤM 1) ==================== -->
  <polygon id="top-pv-panel" points="65,20 165,20 135,56 35,56" fill="#10B982" stroke="#FFFFFF" stroke-width="0.2" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- ==================== KHUNG INVERTER / BỘ ĐIỀU KHIỂN (GIẢM 5%) ==================== -->
  <g id="inverter-box">
    <!-- Khung viền đã giảm 5% -->
    <rect x="32.5" y="100" width="135" height="89" rx="19" fill="none" stroke="#10B982" stroke-width="5.2" stroke-linejoin="round" />

    <!-- Thanh chéo phân chia -->
    <line x1="45" y1="178" x2="155" y2="111" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round" />

    <!-- Ký hiệu '=' (DC) -->
    <line x1="48" y1="121" x2="84" y2="121" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" />
    <line x1="48" y1="134" x2="84" y2="134" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" />

    <!-- Ký hiệu '~' (AC) -->
    <path d="M 112 154 Q 118 146 125 154 T 138 154" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 112 167 Q 118 159 125 167 T 138 167" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
